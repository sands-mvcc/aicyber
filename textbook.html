<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Cybersecurity Foundations – Textbook Chapter Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #020617;
      --panel: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --border: #1e293b;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #f97373;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #0b1120 0, #020617 40%, #000 100%);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
    }

    header {
      padding: 1.5rem 2rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: baseline;
      justify-content: space-between;
    }

    header .title-block {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h1 span.logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: radial-gradient(circle, var(--accent) 0, #0ea5e9 60%, transparent 70%);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .badge {
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
      background: linear-gradient(90deg, rgba(56,189,248,0.12), transparent);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .badge span.pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    main {
      padding: 1rem 2rem 2rem;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 1.25rem;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .panel {
      background: linear-gradient(145deg, rgba(15,23,42,0.95), rgba(15,23,42,0.75));
      border-radius: 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 1rem 1rem 0.9rem;
      box-shadow: 0 18px 55px rgba(15, 23, 42, 0.7);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(56,189,248,0.14), transparent 55%);
      opacity: 0.6;
      pointer-events: none;
      mix-blend-mode: screen;
    }

      position: relative;
      display: flex;
