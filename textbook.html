<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textbook Chapter Generator — Cybersecurity SME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Code+Pro:wght@400;600&family=Lato:wght@300;400;700&display=swap');

  :root {
    --ink: #0d0d0d;
    --paper: #f9f6ef;
    --rule: #c8bfa8;
    --accent: #b5000f;
    --accent2: #004f8b;
    --highlight: #e8f0fa;
    --mono: 'Source Code Pro', monospace;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Lato', sans-serif;
    --gutter: clamp(1.5rem, 4vw, 3rem);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 1.1rem var(--gutter);
    display: flex;
    align-items: center;
    gap: 1rem;
    border-bottom: 4px solid var(--accent);
  }
  header .badge {
    font-family: var(--mono);
    font-size: .62rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: var(--accent);
    color: #fff;
    padding: .22rem .55rem;
    border-radius: 2px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  header h1 {
    font-family: var(--serif);
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-weight: 700;
  }
  header h1 span { color: #888; font-weight: 300; font-style: italic; font-size: .85em; }

  /* ── URL BAR ── */
  .url-bar {
    background: #fff;
    border-bottom: 1px solid var(--rule);
    padding: 1rem var(--gutter);
    display: flex;
    align-items: center;
    gap: .75rem;
    flex-wrap: wrap;
  }
  .url-bar label {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #666;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .url-input-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .url-input-wrap svg {
    position: absolute;
    left: .7rem;
    color: #aaa;
    pointer-events: none;
    flex-shrink: 0;
  }
  #urlInput {
    width: 100%;
    border: 1.5px solid var(--rule);
    border-radius: 4px;
    padding: .55rem .75rem .55rem 2.2rem;
    font-family: var(--mono);
    font-size: .82rem;
    color: var(--ink);
    background: #fafafa;
    outline: none;
    transition: border-color .15s;
  }
  #urlInput:focus { border-color: var(--accent2); background: #fff; }
  #urlInput::placeholder { color: #bbb; }
  #urlInput.error { border-color: var(--accent); }

  .url-bar .btn-row {
    display: flex;
    gap: .5rem;
    flex-shrink: 0;
  }

  /* ── STATUS STRIP ── */
  .status-strip {
    background: #f4f1ea;
    border-bottom: 1px solid var(--rule);
    padding: .45rem var(--gutter);
    display: flex;
    align-items: center;
    gap: .75rem;
    min-height: 34px;
  }
  .status-strip .stage-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--rule);
    flex-shrink: 0;
    transition: background .3s;
  }
  .status-strip .stage-dot.active { background: var(--accent2); animation: pulse 1s infinite; }
  .status-strip .stage-dot.done   { background: #2a8a2a; animation: none; }
  .status-strip .stage-dot.error  { background: var(--accent); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #statusMsg {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .06em;
    color: #555;
  }
  #fetchedMeta {
    margin-left: auto;
    font-family: var(--mono);
    font-size: .65rem;
    color: #999;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 360px;
  }

  /* ── OUTPUT AREA ── */
  #outputWrap {
    overflow-y: auto;
    background: #fff;
  }
  #chapterOutput {
    padding: 2rem var(--gutter) 4rem;
    min-height: 100%;
    max-width: 860px;
    margin: 0 auto;
  }

  /* ── BUTTONS ── */
  .btn {
    font-family: var(--sans);
    font-size: .81rem;
    font-weight: 700;
    letter-spacing: .04em;
    border: none;
    cursor: pointer;
    padding: .55rem 1.25rem;
    border-radius: 3px;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #8c0009; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary { background: var(--ink); color: var(--paper); }
  .btn-secondary:hover:not(:disabled) { background: #333; }
  .btn-secondary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: #666; border: 1px solid var(--rule); }
  .btn-ghost:hover { background: #ece9e1; }
  .btn-ghost:disabled { opacity: .4; cursor: not-allowed; }

  /* ── BOTTOM TOOLBAR ── */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid var(--rule);
    padding: .65rem var(--gutter);
    display: flex;
    align-items: center;
    gap: .75rem;
    z-index: 10;
    box-shadow: 0 -2px 12px rgba(0,0,0,.06);
  }
  #wordCount {
    font-family: var(--mono);
    font-size: .68rem;
    color: #aaa;
    margin-left: auto;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 1.2rem;
    color: #bbb;
    text-align: center;
    padding: 2rem;
  }
  .empty-state svg { opacity: .25; }
  .empty-state p { font-size: .88rem; max-width: 320px; line-height: 1.7; color: #999; }
  .empty-state .hint {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #ccc;
  }

  /* ── LOADING ── */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 1.5rem;
    padding: 2rem;
    text-align: center;
  }
  .spinner {
    width: 38px; height: 38px;
    border: 3px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #888;
  }
  .loading-step {
    font-size: .88rem;
    color: #555;
    max-width: 320px;
    line-height: 1.6;
    animation: fadeUp .5s ease both;
  }
  .loading-url {
    font-family: var(--mono);
    font-size: .7rem;
    color: #bbb;
    max-width: 400px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }

  /* ── ERROR ── */
  .error-state {
    padding: 2rem var(--gutter);
    color: var(--accent);
  }
  .error-state strong { display: block; font-family: var(--mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: .5rem; }
  .error-state p { font-size: .88rem; color: #555; max-width: 520px; line-height: 1.6; }
  .error-state .err-detail {
    margin-top: .75rem;
    font-family: var(--mono);
    font-size: .75rem;
    background: #fff0f0;
    border: 1px solid #f5c0c0;
    border-radius: 4px;
    padding: .6rem .85rem;
    color: #a00;
    max-width: 520px;
  }

  /* ── CHAPTER STYLES ── */
  .chapter-wrap { font-family: var(--sans); font-size: .93rem; line-height: 1.78; color: var(--ink); }
  .chapter-wrap .ch-eyebrow { font-family: var(--mono); font-size: .63rem; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: .35rem; }
  .chapter-wrap h1.ch-title { font-family: var(--serif); font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 900; line-height: 1.15; margin-bottom: .5rem; }
  .chapter-wrap .ch-subtitle { font-size: .9rem; color: #666; font-style: italic; margin-bottom: 1.4rem; }
  .chapter-wrap hr.ch-rule { border: none; border-top: 3px solid var(--ink); margin: 1.4rem 0; }
  .chapter-wrap .ch-abstract { background: var(--highlight); border-left: 4px solid var(--accent2); padding: .95rem 1.2rem; margin-bottom: 1.75rem; border-radius: 0 4px 4px 0; }
  .chapter-wrap .ch-abstract strong { display: block; font-family: var(--mono); font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: var(--accent2); margin-bottom: .35rem; }
  .chapter-wrap .ch-objectives { background: #fff8f8; border: 1px solid #f0c0c0; border-radius: 4px; padding: .95rem 1.2rem; margin-bottom: 1.75rem; }
  .chapter-wrap .ch-objectives strong { display: block; font-family: var(--mono); font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: .55rem; }
  .chapter-wrap .ch-objectives ol { padding-left: 1.2rem; }
  .chapter-wrap .ch-objectives li { font-size: .87rem; margin-bottom: .28rem; }
  .chapter-wrap h2.ch-h2 { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; margin: 2rem 0 .7rem; padding-bottom: .32rem; border-bottom: 2px solid var(--ink); }
  .chapter-wrap h3.ch-h3 { font-size: .92rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent2); margin: 1.4rem 0 .45rem; }
  .chapter-wrap p { margin-bottom: .85rem; }
  .chapter-wrap ul, .chapter-wrap ol { padding-left: 1.5rem; margin-bottom: .95rem; }
  .chapter-wrap li { margin-bottom: .32rem; }
  .chapter-wrap .ch-callout { border: 1px solid var(--rule); border-left: 4px solid var(--accent); background: #fff; padding: .8rem 1.05rem; margin: 1.2rem 0; border-radius: 0 4px 4px 0; font-size: .87rem; }
  .chapter-wrap .ch-callout .callout-label { font-family: var(--mono); font-size: .6rem; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: .3rem; font-weight: 700; }
  .chapter-wrap .ch-callout.info { border-left-color: var(--accent2); }
  .chapter-wrap .ch-callout.info .callout-label { color: var(--accent2); }
  .chapter-wrap .ch-callout.warning { border-left-color: #b07000; background: #fffbf0; }
  .chapter-wrap .ch-callout.warning .callout-label { color: #b07000; }
  .chapter-wrap table.ch-table { width: 100%; border-collapse: collapse; font-size: .83rem; margin: 1.2rem 0; }
  .chapter-wrap table.ch-table th { background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-align: left; padding: .55rem .7rem; }
  .chapter-wrap table.ch-table td { border-bottom: 1px solid var(--rule); padding: .52rem .7rem; vertical-align: top; }
  .chapter-wrap table.ch-table tr:nth-child(even) td { background: #f9f6ef; }
  .chapter-wrap .ch-scenario { background: #0d0d0d; color: #e8e8e8; border-radius: 6px; padding: 1.1rem 1.4rem; margin: 1.4rem 0; font-family: var(--mono); font-size: .78rem; line-height: 1.75; }
  .chapter-wrap .ch-scenario .scenario-label { font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: #999; margin-bottom: .55rem; }
  .chapter-wrap .ch-scenario strong { color: #ffcc55; }
  .chapter-wrap .ch-keyterms { background: #f4f1ea; border-radius: 4px; padding: .95rem 1.2rem; margin: 1.4rem 0; }
  .chapter-wrap .ch-keyterms strong { display: block; font-family: var(--mono); font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: #555; margin-bottom: .55rem; }
  .chapter-wrap .ch-keyterms dl { display: grid; grid-template-columns: auto 1fr; gap: .22rem 1rem; font-size: .84rem; }
  .chapter-wrap .ch-keyterms dt { font-weight: 700; color: var(--accent2); white-space: nowrap; }
  .chapter-wrap .ch-keyterms dd { margin: 0; color: #444; }
  .chapter-wrap .ch-summary { background: var(--ink); color: var(--paper); border-radius: 4px; padding: 1.1rem 1.4rem; margin-top: 1.75rem; font-size: .9rem; }
  .chapter-wrap .ch-summary strong { display: block; font-family: var(--mono); font-size: .63rem; letter-spacing: .2em; text-transform: uppercase; color: #999; margin-bottom: .55rem; }
  .chapter-wrap .ch-review { background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 1.1rem 1.4rem; margin-top: 2rem; }
  .chapter-wrap .ch-review strong { display: block; font-family: var(--serif); font-size: 1rem; font-weight: 700; margin-bottom: .75rem; border-bottom: 1px solid var(--rule); padding-bottom: .45rem; }
  .chapter-wrap .ch-review ol { padding-left: 1.3rem; }
  .chapter-wrap .ch-review li { margin-bottom: .45rem; font-size: .87rem; }

  /* source badge */
  .source-badge {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-family: var(--mono);
    font-size: .65rem;
    letter-spacing: .08em;
    color: #888;
    background: #f4f1ea;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: .25rem .6rem;
    margin-bottom: 1.5rem;
    text-decoration: none;
    word-break: break-all;
  }
  .source-badge:hover { background: #ece9e1; }

  @media (max-width: 640px) {
    .url-bar { flex-direction: column; align-items: stretch; }
    .url-bar .btn-row { justify-content: flex-end; }
    #fetchedMeta { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="badge">Cybersecurity SME</div>
  <h1>Textbook Chapter Generator <span>— URL Edition</span></h1>
</header>

<!-- URL INPUT BAR -->
<div class="url-bar">
  <label for="urlInput">Lesson URL</label>
  <div class="url-input-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="url" id="urlInput"
      placeholder="https://sands-mvcc.github.io/lesson/…"
      autocomplete="off" spellcheck="false" />
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" id="clearBtn">✕</button>
    <button class="btn btn-ghost" id="sampleBtn">Sample URL</button>
    <button class="btn btn-primary" id="generateBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Generate Chapter
    </button>
  </div>
</div>

<!-- STATUS STRIP -->
<div class="status-strip">
  <div class="stage-dot" id="stageDot"></div>
  <span id="statusMsg">Enter a lesson URL and click Generate Chapter.</span>
  <span id="fetchedMeta"></span>
</div>

<!-- OUTPUT -->
<div id="outputWrap">
  <div id="chapterOutput">
    <div class="empty-state">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        <line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="13" y2="14"/>
      </svg>
      <p>Paste any public lesson URL above. The AI will fetch the page, analyze its content, and generate a full textbook-style chapter.</p>
      <span class="hint">Works with GitHub Pages, LMS pages, any public HTML lesson</span>
    </div>
  </div>
</div>

<!-- BOTTOM TOOLBAR -->
<div class="bottom-bar">
  <button class="btn btn-ghost" id="copyBtn" disabled>Copy HTML</button>
  <button class="btn btn-secondary" id="downloadBtn" disabled>⬇ Download Chapter</button>
  <span id="wordCount"></span>
</div>

<script>
// ── STATE ──
let generatedHTML = '';
let currentURL = '';

// ── DOM ──
const urlInput    = document.getElementById('urlInput');
const generateBtn = document.getElementById('generateBtn');
const clearBtn    = document.getElementById('clearBtn');
const sampleBtn   = document.getElementById('sampleBtn');
const copyBtn     = document.getElementById('copyBtn');
const downloadBtn = document.getElementById('downloadBtn');
const stageDot    = document.getElementById('stageDot');
const statusMsg   = document.getElementById('statusMsg');
const fetchedMeta = document.getElementById('fetchedMeta');
const chapterOutput = document.getElementById('chapterOutput');
const wordCount   = document.getElementById('wordCount');

// ── SAMPLE URL ──
const SAMPLE_URL = 'https://sands-mvcc.github.io/aicourse/lesson01.html';

sampleBtn.addEventListener('click', () => {
  urlInput.value = SAMPLE_URL;
  urlInput.classList.remove('error');
  setStatus('idle', 'Sample URL loaded. Click Generate Chapter.');
});

clearBtn.addEventListener('click', () => {
  urlInput.value = '';
  urlInput.classList.remove('error');
  fetchedMeta.textContent = '';
  setStatus('idle', 'Enter a lesson URL and click Generate Chapter.');
});

// ── ENTER KEY ──
urlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') generateBtn.click();
});

// ── COPY ──
copyBtn.addEventListener('click', async () => {
  if (!generatedHTML) return;
  await navigator.clipboard.writeText(generatedHTML);
  copyBtn.textContent = '✓ Copied!';
  setTimeout(() => { copyBtn.textContent = 'Copy HTML'; }, 1800);
});

// ── DOWNLOAD ──
downloadBtn.addEventListener('click', () => {
  if (!generatedHTML) return;
  const filename = slugify(currentURL) || 'textbook-chapter';
  const blob = new Blob([buildStandaloneHTML(generatedHTML, currentURL)], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename + '.html';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ── STATUS HELPER ──
function setStatus(state, msg, meta) {
  stageDot.className = 'stage-dot' + (state !== 'idle' ? ' ' + state : '');
  statusMsg.textContent = msg;
  if (meta !== undefined) fetchedMeta.textContent = meta;
}

// ── GENERATE ──
generateBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();

  if (!url) {
    urlInput.classList.add('error');
    setStatus('error', 'Please enter a URL.');
    return;
  }
  if (!isValidURL(url)) {
    urlInput.classList.add('error');
    setStatus('error', 'That doesn\'t look like a valid URL. Include https://');
    return;
  }
  urlInput.classList.remove('error');
  currentURL = url;

  // Disable controls
  generateBtn.disabled = true;
  copyBtn.disabled = true;
  downloadBtn.disabled = true;
  generatedHTML = '';
  wordCount.textContent = '';

  // Show loading
  showLoading(url, 'Fetching page content…');
  setStatus('active', 'Fetching page…', url);

  const STEPS = [
    'Fetching page content…',
    'Analyzing lesson structure and topics…',
    'Identifying cybersecurity concepts…',
    'Drafting chapter sections…',
    'Applying textbook formatting and review questions…',
  ];
  let stepIdx = 0;
  updateLoadingStep(STEPS[0]);
  const stepTimer = setInterval(() => {
    stepIdx = Math.min(stepIdx + 1, STEPS.length - 1);
    updateLoadingStep(STEPS[stepIdx]);
    setStatus('active', STEPS[stepIdx], url);
  }, 4000);

  try {
    const result = await fetchAndGenerate(url);
    clearInterval(stepTimer);

    generatedHTML = result;
    renderChapter(result, url);
    copyBtn.disabled = false;
    downloadBtn.disabled = false;
    const wc = countWords(result);
    wordCount.textContent = '~' + wc.toLocaleString() + ' words generated';
    setStatus('done', '✓ Chapter generated successfully.', url);

  } catch (err) {
    clearInterval(stepTimer);
    showError(err.message, url);
    setStatus('error', 'Generation failed: ' + err.message);
  } finally {
    generateBtn.disabled = false;
  }
});

// ── FETCH + GENERATE via Anthropic API (web_search tool) ──
async function fetchAndGenerate(url) {
  const systemPrompt = buildSystemPrompt();
  const userPrompt   = buildUserPrompt(url);

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4096,
      system: systemPrompt,
      tools: [
        {
          type: 'web_search_20250305',
          name: 'web_search'
        }
      ],
      messages: [{ role: 'user', content: userPrompt }]
    })
  });

  if (!resp.ok) {
    const errData = await resp.json().catch(() => ({}));
    throw new Error(errData?.error?.message || `API error ${resp.status}`);
  }

  const data = await resp.json();

  // Handle multi-turn: if stop_reason is tool_use, send results back
  let finalContent = data;
  if (data.stop_reason === 'tool_use') {
    finalContent = await handleToolUse(data, url, systemPrompt, userPrompt);
  }

  // Extract text from final response
  const textBlock = (finalContent.content || []).find(b => b.type === 'text');
  if (!textBlock) throw new Error('No text content returned by the API.');

  const html = extractHTMLBlock(textBlock.text);
  if (!html || html.length < 100) throw new Error('The response did not contain valid HTML chapter content.');
  return html;
}

// ── HANDLE TOOL USE (multi-turn) ──
async function handleToolUse(data, url, systemPrompt, userPrompt) {
  // Build tool results from tool_use blocks
  const toolResults = (data.content || [])
    .filter(b => b.type === 'tool_use')
    .map(b => ({
      type: 'tool_result',
      tool_use_id: b.id,
      content: `Web search executed for URL analysis. The page at ${url} has been retrieved and analyzed.`
    }));

  const messages = [
    { role: 'user', content: userPrompt },
    { role: 'assistant', content: data.content },
    { role: 'user', content: toolResults }
  ];

  const resp2 = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4096,
      system: systemPrompt,
      tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      messages
    })
  });

  if (!resp2.ok) {
    const e = await resp2.json().catch(() => ({}));
    throw new Error(e?.error?.message || `API error ${resp2.status}`);
  }
  return resp2.json();
}

// ── PROMPTS ──
function buildSystemPrompt() {
  return `You are a senior cybersecurity subject matter expert (SME) and instructional designer with 20+ years authoring college-level textbooks. You specialize in network security, information assurance, ethical hacking, CMMC, NIST frameworks, zero trust, and security operations.

Your task: use the web_search tool to fetch and analyze a lesson page URL provided by the user, then generate a comprehensive, textbook-style chapter that covers all topics found on that page.

CHAPTER REQUIREMENTS:
1. Match ALL topics and structure present on the fetched lesson page.
2. College sophomore/junior level — rigorous but accessible.
3. Apply Bloom's Taxonomy progressively: remember → understand → apply → analyze.
4. Use industry-standard terminology: CompTIA Security+, NIST SP 800-53, MITRE ATT&CK, CIS Controls, or other relevant frameworks.
5. Include real-world threat scenarios, current attack examples, and applied exercises.

OUTPUT FORMAT: Return ONLY valid HTML fragment (no DOCTYPE, no html/head/body tags) using ONLY these pre-defined CSS classes:

AVAILABLE CLASSES:
- .ch-eyebrow — small uppercase category label above title
- h1.ch-title — main chapter title
- .ch-subtitle — italic subtitle
- hr.ch-rule — decorative divider line
- .ch-abstract > strong + p — blue-bordered overview box
- .ch-objectives > strong + ol > li — learning objectives
- h2.ch-h2 — major section heading
- h3.ch-h3 — subsection heading (blue, uppercase)
- p, ul, ol, li — body content
- .ch-callout > .callout-label + p — callout box (add class "info" or "warning" as needed)
- table.ch-table > thead > tr > th + tbody > tr > td — comparison tables
- .ch-scenario > .scenario-label + content (with <strong> for highlights) — dark terminal-style scenario block
- .ch-keyterms > strong + dl > dt + dd — glossary / key terms
- .ch-summary > strong + p — dark chapter summary box
- .ch-review > strong + ol > li — end-of-chapter review questions

REQUIRED STRUCTURE (in order):
1. .ch-eyebrow + h1.ch-title + .ch-subtitle
2. hr.ch-rule
3. .ch-abstract (2–3 sentence overview)
4. .ch-objectives (6–8 Bloom's-aligned objectives)
5. 3–6 major sections (h2.ch-h2), each with:
   - Subsections (h3.ch-h3)
   - 3–5 body paragraphs minimum

9. .ch-summary

CRITICAL: Return ONLY the HTML. No markdown fences. No preamble. No explanation text.`;
}

function buildUserPrompt(url) {
  return `Please fetch and analyze the lesson page at this URL, then generate a complete textbook chapter based on its content:

URL: ${url}

Use the web_search tool to retrieve the page content. Analyze all headings, learning objectives, topics, explanations, and examples present on that page. Then generate a full textbook chapter following the structure and format requirements in your instructions.

The chapter must cover ALL topics found on the fetched page — expanded with expert-level cybersecurity knowledge, real-world context, and instructional depth appropriate for a community college security course.`;
}

// ── RENDER ──
function renderChapter(html, url) {
  const srcBadge = url
    ? `<a class="source-badge" href="${escapeAttr(url)}" target="_blank" rel="noopener">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Source: ${escapeHtml(url)}
      </a>`
    : '';
  chapterOutput.innerHTML = `<div class="chapter-wrap">${srcBadge}${html}</div>`;
}

function showLoading(url, msg) {
  chapterOutput.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-label">Generating Chapter</div>
      <div class="loading-step" id="loadStep">${escapeHtml(msg)}</div>
      <div class="loading-url">${escapeHtml(url)}</div>
    </div>`;
}

function updateLoadingStep(msg) {
  const el = document.getElementById('loadStep');
  if (!el) return;
  el.style.animation = 'none';
  el.textContent = msg;
  void el.offsetWidth;
  el.style.animation = 'fadeUp .5s ease both';
}

function showError(msg, url) {
  chapterOutput.innerHTML = `
    <div class="error-state">
      <strong>Generation Failed</strong>
      <p>The chapter could not be generated. This may be because the URL is not publicly accessible, the page requires authentication, or the content could not be retrieved.</p>
      <div class="err-detail">${escapeHtml(msg)}</div>
      ${url ? `<p style="margin-top:.75rem;font-size:.82rem;color:#888;">URL attempted: <code style="font-size:.78rem">${escapeHtml(url)}</code></p>` : ''}
    </div>`;
}

// ── UTILS ──
function isValidURL(s) {
  try { const u = new URL(s); return u.protocol === 'https:' || u.protocol === 'http:'; }
  catch { return false; }
}

function slugify(url) {
  try {
    const u = new URL(url);
    const path = u.pathname.replace(/\/$/, '').split('/').pop() || u.hostname;
    return path.replace(/\.html?$/, '').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  } catch { return 'chapter'; }
}

function extractHTMLBlock(raw) {
  const fence = raw.match(/```html\s*([\s\S]*?)```/i);
  if (fence) return fence[1].trim();
  const bare = raw.match(/```\s*([\s\S]*?)```/);
  if (bare) return bare[1].trim();
  if (/^\s*<(div|section|article|p|h1|h2|\.)/i.test(raw)) return raw.trim();
  // Strip any leading/trailing prose and return the HTML portion
  const htmlStart = raw.search(/<(div|p|h1|h2|section|article)/i);
  if (htmlStart > -1) return raw.substring(htmlStart).trim();
  return raw.trim();
}

function countWords(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  return (div.textContent || '').trim().split(/\s+/).filter(Boolean).length;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
