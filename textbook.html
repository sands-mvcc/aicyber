<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textbook Chapter Generator — Cybersecurity SME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Code+Pro:wght@400;600&family=Lato:wght@300;400;700&display=swap');

  :root {
    --ink: #0d0d0d;
    --paper: #f9f6ef;
    --rule: #c8bfa8;
    --accent: #b5000f;
    --accent2: #004f8b;
    --highlight: #e8f0fa;
    --mono: 'Source Code Pro', monospace;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Lato', sans-serif;
    --gutter: clamp(1.5rem, 4vw, 3.5rem);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 1.25rem var(--gutter);
    display: flex;
    align-items: center;
    gap: 1rem;
    border-bottom: 4px solid var(--accent);
  }
  header .badge {
    font-family: var(--mono);
    font-size: .65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: var(--accent);
    color: #fff;
    padding: .25rem .6rem;
    border-radius: 2px;
    white-space: nowrap;
  }
  header h1 {
    font-family: var(--serif);
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    font-weight: 700;
    letter-spacing: .01em;
  }
  header h1 span { color: #aaa; font-weight: 300; font-style: italic; font-size: .85em; }

  /* ── LAYOUT ── */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    height: calc(100vh - 72px);
    overflow: hidden;
  }

  /* ── PANEL ── */
  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--rule);
  }
  .panel:last-child { border-right: none; }

  .panel-header {
    padding: .9rem var(--gutter);
    background: #fff;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-shrink: 0;
  }
  .panel-title {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #666;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .panel-title::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--rule);
  }
  #inputPanel .panel-title::before { background: var(--accent2); }
  #outputPanel .panel-title::before { background: var(--accent); }

  /* ── TEXTAREA ── */
  .paste-area {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  #lessonInput {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    font-family: var(--mono);
    font-size: .8rem;
    line-height: 1.7;
    padding: 1.5rem var(--gutter);
    background: #fafafa;
    color: var(--ink);
    tab-size: 2;
  }
  #lessonInput::placeholder { color: #bbb; }

  /* ── CONTROLS ── */
  .controls {
    padding: .9rem var(--gutter);
    background: #fff;
    border-top: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: .75rem;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .btn {
    font-family: var(--sans);
    font-size: .82rem;
    font-weight: 700;
    letter-spacing: .04em;
    border: none;
    cursor: pointer;
    padding: .6rem 1.4rem;
    border-radius: 3px;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: .4rem;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: #8c0009; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }

  .btn-secondary {
    background: var(--ink);
    color: var(--paper);
  }
  .btn-secondary:hover { background: #333; }
  .btn-secondary:disabled { opacity: .45; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: #666;
    border: 1px solid var(--rule);
  }
  .btn-ghost:hover { background: #f0ede6; }

  .char-count {
    font-family: var(--mono);
    font-size: .7rem;
    color: #aaa;
    margin-left: auto;
  }

  /* ── OUTPUT ── */
  #outputPanel .paste-area {
    overflow-y: auto;
    background: #fff;
  }

  #chapterOutput {
    padding: 2rem var(--gutter) 3rem;
    min-height: 100%;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 2rem;
    gap: 1rem;
    color: #bbb;
    text-align: center;
  }
  .empty-state svg { opacity: .3; }
  .empty-state p { font-size: .85rem; max-width: 260px; line-height: 1.6; }

  /* ── LOADING ── */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 1.5rem;
    padding: 2rem;
    color: var(--ink);
    text-align: center;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label {
    font-family: var(--mono);
    font-size: .75rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #888;
  }
  .loading-progress {
    font-size: .82rem;
    color: #555;
    max-width: 300px;
    line-height: 1.5;
    animation: fadeStep .6s ease forwards;
  }
  @keyframes fadeStep { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ── CHAPTER STYLES ── */
  .chapter-wrap {
    font-family: var(--sans);
    font-size: .93rem;
    line-height: 1.75;
    color: var(--ink);
  }
  .chapter-wrap .ch-eyebrow {
    font-family: var(--mono);
    font-size: .65rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: .4rem;
  }
  .chapter-wrap h1.ch-title {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: .6rem;
    color: var(--ink);
  }
  .chapter-wrap .ch-subtitle {
    font-size: .9rem;
    color: #666;
    font-style: italic;
    margin-bottom: 1.5rem;
  }
  .chapter-wrap hr.ch-rule {
    border: none;
    border-top: 3px solid var(--ink);
    margin: 1.5rem 0;
  }
  .chapter-wrap .ch-abstract {
    background: var(--highlight);
    border-left: 4px solid var(--accent2);
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
    border-radius: 0 4px 4px 0;
  }
  .chapter-wrap .ch-abstract strong {
    display: block;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: .4rem;
  }
  .chapter-wrap .ch-objectives {
    background: #fff8f8;
    border: 1px solid #f0c0c0;
    border-radius: 4px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
  }
  .chapter-wrap .ch-objectives strong {
    display: block;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: .6rem;
  }
  .chapter-wrap .ch-objectives ol {
    padding-left: 1.2rem;
  }
  .chapter-wrap .ch-objectives li { font-size: .88rem; margin-bottom: .3rem; }

  .chapter-wrap h2.ch-h2 {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 700;
    margin: 2rem 0 .75rem;
    padding-bottom: .35rem;
    border-bottom: 2px solid var(--ink);
  }
  .chapter-wrap h3.ch-h3 {
    font-size: .95rem;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--accent2);
    margin: 1.5rem 0 .5rem;
  }
  .chapter-wrap p { margin-bottom: .9rem; }
  .chapter-wrap ul, .chapter-wrap ol {
    padding-left: 1.5rem;
    margin-bottom: 1rem;
  }
  .chapter-wrap li { margin-bottom: .35rem; }

  .chapter-wrap .ch-callout {
    border: 1px solid var(--rule);
    border-left: 4px solid var(--accent);
    background: #fff;
    padding: .85rem 1.1rem;
    margin: 1.25rem 0;
    border-radius: 0 4px 4px 0;
    font-size: .88rem;
  }
  .chapter-wrap .ch-callout .callout-label {
    font-family: var(--mono);
    font-size: .62rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: .35rem;
    font-weight: 700;
  }
  .chapter-wrap .ch-callout.info { border-left-color: var(--accent2); }
  .chapter-wrap .ch-callout.info .callout-label { color: var(--accent2); }
  .chapter-wrap .ch-callout.warning { border-left-color: #b07000; background: #fffbf0; }
  .chapter-wrap .ch-callout.warning .callout-label { color: #b07000; }

  .chapter-wrap table.ch-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .84rem;
    margin: 1.25rem 0;
  }
  .chapter-wrap table.ch-table th {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .08em;
    text-align: left;
    padding: .6rem .75rem;
  }
  .chapter-wrap table.ch-table td {
    border-bottom: 1px solid var(--rule);
    padding: .55rem .75rem;
    vertical-align: top;
  }
  .chapter-wrap table.ch-table tr:nth-child(even) td { background: #f9f6ef; }

  .chapter-wrap .ch-scenario {
    background: #0d0d0d;
    color: #e8e8e8;
    border-radius: 6px;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0;
    font-family: var(--mono);
    font-size: .8rem;
    line-height: 1.7;
  }
  .chapter-wrap .ch-scenario .scenario-label {
    font-size: .62rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: .6rem;
  }
  .chapter-wrap .ch-scenario strong { color: #ffcc55; }

  .chapter-wrap .ch-keyterms {
    background: #f4f1ea;
    border-radius: 4px;
    padding: 1rem 1.25rem;
    margin: 1.5rem 0;
  }
  .chapter-wrap .ch-keyterms strong {
    display: block;
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: .6rem;
  }
  .chapter-wrap .ch-keyterms dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem 1rem; font-size: .85rem; }
  .chapter-wrap .ch-keyterms dt { font-weight: 700; color: var(--accent2); white-space: nowrap; }
  .chapter-wrap .ch-keyterms dd { margin: 0; color: #444; }

  .chapter-wrap .ch-review {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 1.25rem 1.5rem;
    margin-top: 2.5rem;
  }
  .chapter-wrap .ch-review strong {
    display: block;
    font-family: var(--serif);
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: .8rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: .5rem;
  }
  .chapter-wrap .ch-review ol { padding-left: 1.3rem; }
  .chapter-wrap .ch-review li { margin-bottom: .5rem; font-size: .88rem; }

  .chapter-wrap .ch-summary {
    background: var(--ink);
    color: var(--paper);
    border-radius: 4px;
    padding: 1.25rem 1.5rem;
    margin-top: 2rem;
    font-size: .9rem;
  }
  .chapter-wrap .ch-summary strong {
    display: block;
    font-family: var(--mono);
    font-size: .65rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: .6rem;
  }

  /* ── ERROR ── */
  .error-state {
    padding: 2rem var(--gutter);
    color: var(--accent);
    font-size: .88rem;
  }
  .error-state strong { display: block; margin-bottom: .4rem; font-family: var(--mono); }

  /* ── STATUS BAR ── */
  .status-bar {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .08em;
    color: #999;
    padding: 0 .75rem;
  }

  /* ── TOOLTIP ── */
  [title] { cursor: help; }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: auto; overflow: visible; }
    .panel { height: 50vh; border-right: none; border-bottom: 1px solid var(--rule); }
  }
</style>
</head>
<body>

<header>
  <div class="badge">Cybersecurity SME</div>
  <h1>Textbook Chapter Generator <span>— AI-Powered Instructional Tool</span></h1>
</header>

<main>

  <!-- LEFT: INPUT PANEL -->
  <div class="panel" id="inputPanel">
    <div class="panel-header">
      <span class="panel-title">Lesson Input (HTML)</span>
      <div style="display:flex;gap:.5rem;align-items:center;">
        <button class="btn btn-ghost" id="clearBtn" title="Clear input">✕ Clear</button>
        <button class="btn btn-ghost" id="sampleBtn" title="Load a sample cybersecurity lesson">Sample</button>
      </div>
    </div>
    <div class="paste-area">
      <textarea id="lessonInput" spellcheck="false"
        placeholder="Paste your lesson HTML here…&#10;&#10;The generator will analyze headings, learning objectives, topics, and content structure to produce a matching textbook-style chapter.&#10;&#10;Tip: Include &lt;h1&gt;, &lt;h2&gt;, &lt;ul&gt;, &lt;p&gt; tags for best results."></textarea>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="generateBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Generate Chapter
      </button>
      <span class="status-bar" id="statusBar">Waiting for input…</span>
      <span class="char-count" id="charCount">0 chars</span>
    </div>
  </div>

  <!-- RIGHT: OUTPUT PANEL -->
  <div class="panel" id="outputPanel">
    <div class="panel-header">
      <span class="panel-title">Generated Chapter</span>
      <div style="display:flex;gap:.5rem;">
        <button class="btn btn-ghost" id="copyBtn" disabled>Copy HTML</button>
        <button class="btn btn-secondary" id="downloadBtn" disabled>⬇ Download</button>
      </div>
    </div>
    <div class="paste-area" id="outputArea">
      <div id="chapterOutput">
        <div class="empty-state">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <p>Your generated textbook chapter will appear here. Paste an HTML lesson and click <strong>Generate Chapter</strong>.</p>
        </div>
      </div>
    </div>
    <div class="controls">
      <span class="status-bar" id="outputStatus">No chapter generated yet.</span>
    </div>
  </div>

</main>

<script>
// ── STATE ──
let generatedHTML = '';

// ── DOM ──
const lessonInput   = document.getElementById('lessonInput');
const generateBtn   = document.getElementById('generateBtn');
const clearBtn      = document.getElementById('clearBtn');
const sampleBtn     = document.getElementById('sampleBtn');
const copyBtn       = document.getElementById('copyBtn');
const downloadBtn   = document.getElementById('downloadBtn');
const charCount     = document.getElementById('charCount');
const statusBar     = document.getElementById('statusBar');
const outputStatus  = document.getElementById('outputStatus');
const chapterOutput = document.getElementById('chapterOutput');

// ── CHAR COUNT ──
lessonInput.addEventListener('input', () => {
  const n = lessonInput.value.length;
  charCount.textContent = n.toLocaleString() + ' chars';
  statusBar.textContent = n > 0 ? 'Ready to generate.' : 'Waiting for input…';
});

// ── CLEAR ──
clearBtn.addEventListener('click', () => {
  lessonInput.value = '';
  charCount.textContent = '0 chars';
  statusBar.textContent = 'Waiting for input…';
});

// ── SAMPLE ──
sampleBtn.addEventListener('click', () => {
  lessonInput.value = SAMPLE_LESSON;
  charCount.textContent = SAMPLE_LESSON.length.toLocaleString() + ' chars';
  statusBar.textContent = 'Sample lesson loaded. Ready to generate.';
});

// ── COPY ──
copyBtn.addEventListener('click', async () => {
  if (!generatedHTML) return;
  await navigator.clipboard.writeText(generatedHTML);
  copyBtn.textContent = 'Copied!';
  setTimeout(() => copyBtn.textContent = 'Copy HTML', 1800);
});

// ── DOWNLOAD ──
downloadBtn.addEventListener('click', () => {
  if (!generatedHTML) return;
  const blob = new Blob([buildStandaloneHTML(generatedHTML)], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'textbook-chapter.html';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ── GENERATE ──
generateBtn.addEventListener('click', async () => {
  const raw = lessonInput.value.trim();
  if (!raw) {
    statusBar.textContent = '⚠ Paste a lesson first.';
    return;
  }

  // Extract readable text
  const text = extractText(raw);
  if (text.length < 30) {
    statusBar.textContent = '⚠ Could not extract meaningful content from the HTML.';
    return;
  }

  setLoading(true);
  copyBtn.disabled = true;
  downloadBtn.disabled = true;
  generatedHTML = '';

  const STEPS = [
    'Parsing lesson structure…',
    'Identifying core concepts…',
    'Mapping to cybersecurity frameworks…',
    'Drafting chapter sections…',
    'Applying textbook formatting…',
  ];
  let stepIdx = 0;
  showLoadingState(STEPS[0]);
  const stepTimer = setInterval(() => {
    stepIdx = Math.min(stepIdx + 1, STEPS.length - 1);
    updateLoadingStep(STEPS[stepIdx]);
  }, 3500);

  try {
    const systemPrompt = buildSystemPrompt();
    const userPrompt   = buildUserPrompt(text, raw);

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4096,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const raw_out = data.content?.find(b => b.type === 'text')?.text || '';
    const html = extractHTMLBlock(raw_out);

    clearInterval(stepTimer);
    setLoading(false);

    if (!html) {
      throw new Error('No HTML content returned. Try again.');
    }

    generatedHTML = html;
    renderChapter(html);
    copyBtn.disabled = false;
    downloadBtn.disabled = false;
    outputStatus.textContent = '✓ Chapter generated successfully.';
    statusBar.textContent = '✓ Done.';

  } catch (e) {
    clearInterval(stepTimer);
    setLoading(false);
    chapterOutput.innerHTML = `<div class="error-state"><strong>Generation Failed</strong>${escapeHtml(e.message)}</div>`;
    outputStatus.textContent = 'Error: ' + e.message;
    statusBar.textContent = '⚠ Error. Try again.';
  }
});

// ── HELPERS ──
function extractText(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  // Remove scripts/styles
  div.querySelectorAll('script, style, noscript').forEach(el => el.remove());
  return div.textContent.replace(/\s+/g, ' ').trim();
}

function extractHTMLBlock(raw) {
  // Try to find ```html ... ``` block
  const fence = raw.match(/```html\s*([\s\S]*?)```/i);
  if (fence) return fence[1].trim();
  // Try bare ``` ... ```
  const bare = raw.match(/```\s*([\s\S]*?)```/);
  if (bare) return bare[1].trim();
  // If it starts with <div or <section or <article, return as-is
  if (/^\s*<(div|section|article|h1|h2)/i.test(raw)) return raw.trim();
  return raw.trim();
}

function renderChapter(html) {
  chapterOutput.innerHTML = `<div class="chapter-wrap">${html}</div>`;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setLoading(on) {
  generateBtn.disabled = on;
  if (!on) return;
}

function showLoadingState(msg) {
  chapterOutput.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-label">Generating Chapter</div>
      <div class="loading-progress" id="loadStep">${escapeHtml(msg)}</div>
    </div>`;
}

function updateLoadingStep(msg) {
  const el = document.getElementById('loadStep');
  if (!el) return;
  el.style.animation = 'none';
  el.textContent = msg;
  void el.offsetWidth;
  el.style.animation = '';
}

function buildStandaloneHTML(bodyContent) {
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textbook Chapter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Code+Pro:wght@400;600&family=Lato:wght@300;400;700&display=swap');
:root{--ink:#0d0d0d;--paper:#f9f6ef;--rule:#c8bfa8;--accent:#b5000f;--accent2:#004f8b;--highlight:#e8f0fa;--mono:'Source Code Pro',monospace;--serif:'Playfair Display',Georgia,serif;--sans:'Lato',sans-serif;}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);max-width:780px;margin:0 auto;padding:3rem 2rem 6rem;}
.chapter-wrap{font-family:var(--sans);font-size:.97rem;line-height:1.8;color:var(--ink);}
.ch-eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem;}
h1.ch-title{font-family:var(--serif);font-size:2.2rem;font-weight:900;line-height:1.15;margin-bottom:.6rem;}
.ch-subtitle{font-size:.9rem;color:#666;font-style:italic;margin-bottom:1.5rem;}
hr.ch-rule{border:none;border-top:3px solid var(--ink);margin:1.5rem 0;}
.ch-abstract{background:var(--highlight);border-left:4px solid var(--accent2);padding:1rem 1.25rem;margin-bottom:2rem;border-radius:0 4px 4px 0;}
.ch-abstract strong{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent2);margin-bottom:.4rem;}
.ch-objectives{background:#fff8f8;border:1px solid #f0c0c0;border-radius:4px;padding:1rem 1.25rem;margin-bottom:2rem;}
.ch-objectives strong{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem;}
.ch-objectives ol{padding-left:1.2rem;}
h2.ch-h2{font-family:var(--serif);font-size:1.35rem;font-weight:700;margin:2rem 0 .75rem;padding-bottom:.35rem;border-bottom:2px solid var(--ink);}
h3.ch-h3{font-size:.95rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent2);margin:1.5rem 0 .5rem;}
p{margin-bottom:.9rem;}ul,ol{padding-left:1.5rem;margin-bottom:1rem;}li{margin-bottom:.35rem;}
.ch-callout{border:1px solid var(--rule);border-left:4px solid var(--accent);background:#fff;padding:.85rem 1.1rem;margin:1.25rem 0;border-radius:0 4px 4px 0;font-size:.88rem;}
.ch-callout .callout-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:.35rem;font-weight:700;}
.ch-callout.info{border-left-color:var(--accent2);}.ch-callout.info .callout-label{color:var(--accent2);}
.ch-callout.warning{border-left-color:#b07000;background:#fffbf0;}.ch-callout.warning .callout-label{color:#b07000;}
table.ch-table{width:100%;border-collapse:collapse;font-size:.84rem;margin:1.25rem 0;}
table.ch-table th{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-align:left;padding:.6rem .75rem;}
table.ch-table td{border-bottom:1px solid var(--rule);padding:.55rem .75rem;vertical-align:top;}
table.ch-table tr:nth-child(even) td{background:#f9f6ef;}
.ch-scenario{background:#0d0d0d;color:#e8e8e8;border-radius:6px;padding:1.25rem 1.5rem;margin:1.5rem 0;font-family:var(--mono);font-size:.8rem;line-height:1.7;}
.ch-scenario .scenario-label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:#aaa;margin-bottom:.6rem;}
.ch-scenario strong{color:#ffcc55;}
.ch-keyterms{background:#f4f1ea;border-radius:4px;padding:1rem 1.25rem;margin:1.5rem 0;}
.ch-keyterms strong{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:.6rem;}
.ch-keyterms dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;font-size:.85rem;}
.ch-keyterms dt{font-weight:700;color:var(--accent2);white-space:nowrap;}
.ch-keyterms dd{margin:0;color:#444;}
.ch-review{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:1.25rem 1.5rem;margin-top:2.5rem;}
.ch-review strong{display:block;font-family:var(--serif);font-size:1.05rem;font-weight:700;margin-bottom:.8rem;border-bottom:1px solid var(--rule);padding-bottom:.5rem;}
.ch-review ol{padding-left:1.3rem;}
.ch-review li{margin-bottom:.5rem;font-size:.88rem;}
.ch-summary{background:var(--ink);color:var(--paper);border-radius:4px;padding:1.25rem 1.5rem;margin-top:2rem;font-size:.9rem;}
.ch-summary strong{display:block;font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#aaa;margin-bottom:.6rem;}
</style>
</head>
<body>
<div class="chapter-wrap">
${bodyContent}
</div>
</body>
</html>`;
}

// ── PROMPTS ──
function buildSystemPrompt() {
  return `You are a senior cybersecurity subject matter expert (SME) and instructional designer with 20+ years of experience authoring professional textbooks for community college and university courses. You specialize in network security, information assurance, ethical hacking, CMMC, NIST frameworks, and security operations.

Your task is to receive a lesson (provided as extracted text from an HTML file) and generate a comprehensive, textbook-style chapter that:
1. Matches the EXACT topics and structure of the lesson provided.
2. Is written at a college sophomore/junior level — rigorous but accessible.
3. Applies Bloom's Taxonomy: remember → understand → apply → analyze levels throughout.
4. Uses industry-standard terminology aligned to CompTIA Security+, NIST SP 800-53, MITRE ATT&CK, or relevant frameworks as appropriate.
5. Includes real-world examples, threat actor scenarios, and applied practice questions.

OUTPUT FORMAT: Return ONLY valid HTML (no DOCTYPE, no <html>, <head>, or <body> tags) using ONLY the following CSS classes which are pre-defined:
- .ch-eyebrow (small category label above title)
- h1.ch-title (chapter title)
- .ch-subtitle (brief subtitle)
- hr.ch-rule (decorative rule)
- .ch-abstract > strong + p (chapter abstract/overview box)
- .ch-objectives > strong + ol > li (learning objectives list)
- h2.ch-h2 (major section headings)
- h3.ch-h3 (subsection headings)
- p (body paragraphs)
- ul / ol / li (lists)
- .ch-callout > .callout-label + p (with optional class: info, warning)
- table.ch-table > thead > tr > th + tbody > tr > td (comparison tables)
- .ch-scenario > .scenario-label + content with <strong> for emphasis (dark code-block style scenario)
- .ch-keyterms > strong + dl > dt + dd (glossary-style key terms)
- .ch-summary > strong + p (chapter summary box)
- .ch-review > strong + ol > li (end-of-chapter review questions)

STRUCTURE REQUIREMENTS:
1. Chapter eyebrow label + title + subtitle
2. Decorative rule
3. Abstract (2-3 sentence chapter overview)
4. Learning Objectives (5–8 objectives aligned to Bloom's)
5. Major content sections (3–6 sections with h2 headings, subsections with h3)
   - Each section: 3–5 body paragraphs minimum
   - Include at least one callout box per major section
   - Include at least one scenario, table, or key terms block per chapter
6. Chapter Summary
7. Key Terms glossary
8. Review Questions (8–10 questions, mix of recall, application, analysis)

Write with authority, precision, and instructional clarity. Do NOT include any prose outside the HTML. Do NOT wrap in markdown fences.`;
}

function buildUserPrompt(text, originalHTML) {
  // Extract title hints from HTML
  const titleMatch = originalHTML.match(/<h1[^>]*>(.*?)<\/h1>/i);
  const titleHint = titleMatch ? titleMatch[1].replace(/<[^>]+>/g,'').trim() : '';

  return `Generate a complete textbook chapter based on the following lesson content.
${titleHint ? `\nLesson Title: ${titleHint}` : ''}

LESSON CONTENT (extracted text):
---
${text.substring(0, 6000)}
---

Instructions:
- Generate a full textbook chapter covering ALL topics present in this lesson.
- Expand each topic with expert-level explanation, real-world context, and cybersecurity best practices.
- Use only the approved CSS classes listed in your system prompt.
- Return ONLY the HTML content — no markdown fences, no preamble.`;
}

// ── SAMPLE LESSON ──
const SAMPLE_LESSON = `<!DOCTYPE html>
<html>
<head><title>Introduction to Firewalls and Network Perimeter Security</title></head>
<body>
<h1>Introduction to Firewalls and Network Perimeter Security</h1>
<p>This lesson introduces students to firewall technologies and their role in defending network perimeters.</p>

<h2>Learning Objectives</h2>
<ul>
  <li>Define what a firewall is and explain its primary function in network security.</li>
  <li>Compare and contrast packet-filtering, stateful inspection, and next-generation firewalls.</li>
  <li>Describe DMZ architecture and its security benefits.</li>
  <li>Configure basic access control list (ACL) rules.</li>
</ul>

<h2>What is a Firewall?</h2>
<p>A firewall is a network security device that monitors and controls incoming and outgoing traffic based on predetermined security rules. It creates a barrier between trusted internal networks and untrusted external networks.</p>

<h2>Types of Firewalls</h2>
<ul>
  <li><strong>Packet-Filtering Firewalls:</strong> Inspect packets at the network layer (Layer 3). Examine source/destination IP, port, protocol.</li>
  <li><strong>Stateful Inspection Firewalls:</strong> Track the state of active connections. More secure than stateless packet filtering.</li>
  <li><strong>Application Layer / Proxy Firewalls:</strong> Operate at Layer 7. Deep packet inspection. Can detect application-level attacks.</li>
  <li><strong>Next-Generation Firewalls (NGFW):</strong> Combine traditional firewall capabilities with IPS, SSL inspection, and application awareness.</li>
</ul>

<h2>DMZ Architecture</h2>
<p>A demilitarized zone (DMZ) is a perimeter network that adds an additional layer of security. Public-facing services (web, mail, DNS) are placed in the DMZ, isolated from the internal network.</p>

<h2>Access Control Lists (ACLs)</h2>
<p>ACLs are ordered lists of permit/deny rules applied to network interfaces. They control which traffic is allowed based on IP address, port, and protocol.</p>

<h2>Key Terms</h2>
<ul>
  <li>Firewall, Packet filter, Stateful inspection, NGFW, DMZ, ACL, Ingress filtering, Egress filtering</li>
</ul>
</body>
</html>`;
</script>
</body>
</html>
